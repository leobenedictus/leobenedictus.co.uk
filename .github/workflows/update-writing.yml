name: Update Writing page

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-writing

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Rebuild writing.html from the Substack feed
        run: python scripts/build_writing.py

      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain -- writing.html data/substack-posts.json)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writing.html data/substack-posts.json
          git commit -m "Update Writing page from Substack feed"
          git push
